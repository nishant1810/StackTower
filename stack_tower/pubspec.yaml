name: stack_tower
description: Stack Tower Game
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_audio: ^2.11.0
  shared_preferences: ^2.5.5
  vibration: ^3.1.0
  google_mobile_ads: ^9.0.0
  google_fonts: ^6.3.2
  games_services: ^4.0.0
  google_sign_in: ^7.0.0
  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_remote_config: ^6.0.0
  firebase_performance: ^0.11.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/images/splash/
    - lib/core/assets/images/home/
    - lib/core/assets/images/daily_reward/
    - lib/core/assets/images/game/
    - lib/core/assets/images/icons/
    - lib/core/assets/audio/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "lib/core/assets/images/icons/icon.png"

  adaptive_icon_foreground: "lib/core/assets/images/icons/icon.png"

  adaptive_icon_background: "#0B1026"

  min_sdk_android: 21