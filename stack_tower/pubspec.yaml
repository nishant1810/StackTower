name: stack_tower
description: Stack Tower Game
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  shared_preferences: ^2.5.5
  flame_audio: ^2.11.0
  vibration: ^3.1.0
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo.png"

  min_sdk_android: 21

  adaptive_icon_background: "#0B1026"
  adaptive_icon_foreground: "assets/images/logo.png"