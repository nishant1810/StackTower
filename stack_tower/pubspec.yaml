name: stack_tower
description: Stack Tower Game
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game Engine
  flame: ^1.37.0
  flame_audio: ^2.11.0

  # Storage
  shared_preferences: ^2.5.5

  # Ads
  google_mobile_ads: ^9.0.0

  # UI
  google_fonts: ^6.3.2

  # In-App Purchases
  in_app_purchase: ^3.2.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Google Sign In
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/images/icon.webp
  adaptive_icon_foreground: assets/images/icon.webp
  adaptive_icon_background: "#0B1026"
  min_sdk_android: 21